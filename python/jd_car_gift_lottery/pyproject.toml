[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jd-car-gift-lottery"
version = "0.1.0"
description = "京东「免费小保养」抢购自动化工具（Playwright + CDP）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jd_car_gift_lottery" }]
keywords = ["jd", "playwright", "automation", "login", "grab"]
dependencies = [
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-playwright>=0.5",
]

[project.scripts]
jd-grab = "src.grab:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
