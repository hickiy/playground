[project]
name = "browserhost"
version = "0.1.0"
description = "常驻真实 Chrome 的 CDP 宿主：为多个爬虫任务提供持久登录态与相互隔离的标签页环境"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "yanyun" }]
keywords = ["chrome", "cdp", "playwright", "automation", "macos"]
dependencies = [
    "playwright>=1.40",
]

[tool.uv]
# 非安装型项目：本项目只作为独立工具自己用（`python main.py start|stop|restart`），
# 不打包、不对外提供库接口——其他项目一律通过 9222 端口的 CDP 访问浏览器实例。
package = false
